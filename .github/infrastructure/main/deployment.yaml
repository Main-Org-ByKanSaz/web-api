apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-api
  template:
    metadata:
      labels:
        app: web-api
    spec:
      containers:
        - name: web-api
          image: 148761683462.dkr.ecr.ap-southeast-1.amazonaws.com/web-api:3077f27045d34444622152e64efd3fcbf4f1f0d7
          ports:
            - containerPort: 3000
