apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-api
  template:
    metadata:
      labels:
        app: web-api
    spec:
      containers:
        - name: web-api
          image: 148761683462.dkr.ecr.ap-southeast-1.amazonaws.com/web-api:e23515d2862cb9323e80f0460950832139de3cb8
          ports:
            - containerPort: 3000
