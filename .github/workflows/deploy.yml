name: Deploy web-api

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-1 # ปรับตาม Region ที่ใช้
  ECR_REPOSITORY: web-api # ชื่อ Repository ใน AWS ECR
  ECS_SERVICE: web-api-service # ชื่อ Service ใน AWS ECS
  ECS_CLUSTER: web-api-cluster # ชื่อ Cluster ใน AWS ECS
  ECS_TASK_DEFINITION: .aws/task-def.json # Path ของไฟล์ Task Definition
  CONTAINER_NAME: web-api # ชื่อ Container ที่ตั้งใน Task Definition

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: Main-env
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Image Tag
        run: |
          cd .github/infrastructure/main
          sed -i 's|image: .*web-api:.*|image: 148761683462.dkr.ecr.ap-southeast-1.amazonaws.com/web-api:'"${{ github.sha }}"'|g' deployment.yaml

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update image tag to ${{ github.sha }}"
            git push origin main
          else
            echo "No changes to commit"
          fi
